<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Perfecta — Carta Interactiva</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-a:#fff6f8; --bg-b:#fff0f6; --accent:#ff6e98; --muted:#6a4350;
    --shadow:0 14px 40px rgba(106,67,80,0.08);
    --max-w:980px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:linear-gradient(180deg,var(--bg-a),var(--bg-b));
    color:var(--muted);
    display:flex; align-items:center; justify-content:center; padding:18px; overflow:hidden;
  }

  /* Full-screen intro overlay (black with stars) */
  #intro {
    position:fixed; inset:0; background:#000; z-index:1200;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    touch-action:none;
  }
  #intro h1{
    color:#fff; font-family:Poppins, sans-serif; font-size:clamp(20px,5vw,44px);
    user-select:none;
  }
  canvas.bg, canvas.fire, canvas.hearts {
    position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1000;
  }

  /* Layout */
  .stage{
    width:100%; max-width:var(--max-w); position:relative; z-index:50; display:flex; align-items:center; justify-content:center;
  }

  /* Envelope / paper */
  .wrap{ width:380px; max-width:75vw; perspective:1400px; position:relative }
  .envelope{
    width:100%; border-radius:16px; background:linear-gradient(180deg,#fff,#fff7fb); box-shadow:var(--shadow);
    position:relative; transform-style:preserve-3d; cursor:pointer; overflow:visible;
  }
  .flap{
    position:absolute; left:0; right:0; top:0; height:60%; border-radius:16px 16px 0 0;
    background:linear-gradient(180deg,#ffdfe9,#fff4fb); transform-origin:top center; transition:transform .9s cubic-bezier(.2,.9,.25,1);
    display:flex; align-items:flex-start; justify-content:center; padding-top:8%;
    z-index:6;
  }
  .seal{
    width:72px; height:72px; border-radius:999px; display:grid; place-items:center; font-family:Georgia, serif;
    font-weight:700; color:var(--accent); background:linear-gradient(#fff,#ffeef8); box-shadow:0 12px 34px rgba(255,110,152,0.08);
  }

  .body{
    position:absolute; left:6%; right:6%; bottom:6%; top:42%; border-radius:10px; background:linear-gradient(180deg,#fff,#fff8fb);
    z-index:1; box-shadow:inset 0 6px 12px rgba(0,0,0,0.02); display:flex; align-items:flex-start; justify-content:center; padding-top:2%;
  }

  .sheet{
    width:88%; height:120%; background:linear-gradient(180deg,#fff,#fff9fb); border-radius:10px; padding:20px;
    transform-origin:top center; transform: translateY(28%) rotateX(78deg) scaleY(.86); opacity:0;
    transition: transform 780ms cubic-bezier(.2,.9,.25,1), opacity 420ms;
    box-shadow: 0 14px 36px rgba(106,67,80,0.06);
    overflow:hidden;
    font-family: Georgia, serif; color:#4b2f36; font-size:15px; line-height:1.6;
  }
  .fold{ position:absolute; left:0; right:0; top:0; height:44%; background:linear-gradient(180deg,#fff9fb,#fff5f9);
         transform-origin:top center; transform: rotateX(88deg); transition: transform 820ms cubic-bezier(.2,.9,.25,1); z-index:8; border-bottom-left-radius:12px; border-bottom-right-radius:12px; }

  .content{ margin-top:44%; opacity:0; transform:translateY(6px); transition:opacity 520ms, transform 520ms; padding-right:6px; }

  /* OPEN states */
  .envelope.open .flap{ transform: rotateX(172deg) translateY(-2%); box-shadow:0 22px 58px rgba(106,67,80,0.12); }
  .envelope.open .sheet{ transform: translateY(-68%) rotateX(0deg) scaleY(1); opacity:1; }
  .envelope.open .fold{ transform: rotateX(0deg); }
  .envelope.open .content{ opacity:1; transform:none; transition-delay:420ms; }

  /* typing caret */
  .caret{ display:inline-block; width:2px; height:1.06em; background:linear-gradient(180deg,var(--accent),#ffb3cf); margin-left:6px; animation:blink 900ms steps(1) infinite; vertical-align:bottom; }
  @keyframes blink{50%{opacity:0}}

  /* controls */
  .controls{ position:fixed; right:18px; bottom:18px; z-index:1300; background:linear-gradient(180deg,#fff,#fff6fb); padding:8px 12px; border-radius:999px; box-shadow:var(--shadow); display:flex; gap:10px; align-items:center; }
  .controls button{ border:none; background:transparent; color:var(--accent); font-size:18px; cursor:pointer }
  .controls input[type=range]{ width:120px; accent-color:var(--accent); }

  /* small check area for verification messages */
  #verifications{ position:fixed; left:12px; bottom:12px; background:rgba(255,255,255,0.9); padding:8px 12px; border-radius:10px; box-shadow:var(--shadow); font-size:13px; z-index:1400; max-width:320px; }

  /* responsive */
  @media (max-width:640px){
    .wrap{ width:86vw; }
    .controls input[type=range]{ width:88px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important; animation:none!important}
  }
</style>
</head>
<body>

<!-- Background canvases -->
<canvas id="starsCanvas" class="bg"></canvas>
<canvas id="heartsCanvas" class="hearts"></canvas>
<canvas id="fireCanvas" class="fire"></canvas>

<!-- Intro overlay (black) -->
<div id="intro" role="dialog" aria-label="Pantalla de entrada. Toca para comenzar.">
  <canvas id="introStars" class="bg"></canvas>
  <h1 id="introText">Toca en cualquier lugar</h1>
  <p style="color:rgba(255,255,255,0.6);margin-top:8px;font-size:13px">Presiona Enter o Espacio si usas teclado</p>
</div>

<!-- Main scene -->
<main class="stage" role="main" aria-live="polite">
  <div class="wrap" id="wrap">
    <div class="envelope" id="envelope" role="button" aria-label="Abrir carta">
      <div class="flap" id="flap"><div class="seal">♡</div></div>
      <div class="body">
        <div class="sheet" id="sheet" aria-live="polite">
          <div class="fold" id="fold"></div>
          <div class="content" id="content"><div id="note"></div></div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Controls -->
<div class="controls" id="controls" aria-label="Controles de reproducción" hidden>
  <button id="btnPlay" aria-label="Pausa/Reanuda">▮▮</button>
  <button id="btnReplay" aria-label="Reproducir desde el inicio">⟲</button>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volumen">
</div>

<!-- Small verification box -->
<div id="verifications" aria-hidden="false">
  <strong>Verificaciones:</strong>
  <ul id="verList" style="margin-top:6px;padding-left:16px"></ul>
</div>

<!-- Hidden iframe placeholder (we will set src after user gesture) -->
<iframe id="ytFrame" style="width:0;height:0;border:0;visibility:hidden;position:absolute;left:-9999px;" allow="autoplay; encrypted-media"></iframe>

<script>
/* ========= CONFIGURABLE ========= */
const VIDEO_ID = 'iXqGJa4LpDo'; // YouTube ID seleccionado (consulta: search). Fuente: web.run. :contentReference[oaicite:1]{index=1}
const TYPE_TEXT = `Mi amor,

En este papel dejo palabras sencillas pero verdaderas.
Gracias por cada instante, por tu risa y tu calma.
Que hoy y siempre sientas este abrazo en verso.

Con todo mi cariño,
[Tu nombre aquí]`;

const TYPE_SPEED_BASE = 36;          // ms per char (will be adapted if we can access duration)
const FIREWORK_LARGE = 140;         // particles per explosion (bigger)
const FIREWORK_FREQ = 240;          // ms between launches during show
const HEART_SPAWN_RATE = 220;       // ms (how often a heart starts falling)

/* ========= DOM ========= */
const intro = document.getElementById('intro');
const introText = document.getElementById('introText');
const envelope = document.getElementById('envelope');
const sheet = document.getElementById('sheet');
const content = document.getElementById('content');
const note = document.getElementById('note');
const controls = document.getElementById('controls');
const btnPlay = document.getElementById('btnPlay');
const btnReplay = document.getElementById('btnReplay');
const vol = document.getElementById('vol');
const ytFrame = document.getElementById('ytFrame');
const verList = document.getElementById('verList');

/* ========= Helpers & Accessibility ========= */
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let opened = false, musicStarted = false, isPlaying = false;

/* ========= CANVAS: intro stars (overlay) ========= */
const introStars = document.getElementById('introStars');
const iSctx = introStars.getContext('2d');
function resizeCanvas(c){ c.width = innerWidth * (devicePixelRatio||1); c.height = innerHeight * (devicePixelRatio||1); c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; iSctx.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0); }
function resizeIntro(){ resizeCanvas(introStars); }
resizeIntro(); addEventListener('resize', resizeIntro);

let istars = [];
function initIntroStars(){
  istars = [];
  const count = Math.max(80, Math.floor(innerWidth/10));
  for(let i=0;i<count;i++) istars.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.6+0.6, speed:Math.random()*0.6+0.2, drift:(Math.random()-0.5)*0.3});
}
initIntroStars();
let introAnim = true;
function drawIntroStars(){
  const ctx = iSctx;
  ctx.clearRect(0,0,innerWidth,innerHeight);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  for(const s of istars){
    s.y += s.speed;
    s.x += s.drift;
    if(s.y > innerHeight + 10){ s.y = -10; s.x = Math.random()*innerWidth; }
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  if(introAnim && !prefersReducedMotion) requestAnimationFrame(drawIntroStars);
}
drawIntroStars();

/* ========= CANVAS: hearts falling (behind everything) ========= */
const heartsCanvas = document.getElementById('heartsCanvas');
const hctx = heartsCanvas.getContext('2d');
function resizeHearts(){ heartsCanvas.width = innerWidth * (devicePixelRatio||1); heartsCanvas.height = innerHeight * (devicePixelRatio||1); heartsCanvas.style.width = innerWidth + 'px'; heartsCanvas.style.height = innerHeight + 'px'; hctx.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0); }
resizeHearts(); addEventListener('resize', resizeHearts);

let hearts = [];
function spawnHeart(){
  const size = 18 + Math.random()*34;
  hearts.push({
    x: Math.random()*innerWidth,
    y: -30 - Math.random()*200,
    vx: (Math.random()-0.5)*0.6,
    vy: 0.6 + Math.random()*1.6,
    size: size,
    rot: Math.random()*Math.PI*2,
    spin: (Math.random()-0.5)*0.02,
    opacity: 0.9,
    color: `hsl(${320 + Math.random()*40}, 85%, ${60 + Math.random()*12}%)`
  });
}

function drawHeartPath(ctx, x, y, size){
  // simple heart path (relative)
  ctx.beginPath();
  const s = size/24;
  ctx.moveTo(x, y + 8*s);
  ctx.bezierCurveTo(x, y, x - 12*s, y, x - 12*s, y + 6*s);
  ctx.bezierCurveTo(x - 12*s, y + 12*s, x, y + 18*s, x, y + 22*s);
  ctx.bezierCurveTo(x, y + 18*s, x + 12*s, y + 12*s, x + 12*s, y + 6*s);
  ctx.bezierCurveTo(x + 12*s, y, x, y, x, y + 8*s);
  ctx.closePath();
}

function animateHearts(){
  hctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=hearts.length-1;i>=0;i--){
    const p = hearts[i];
    p.vy += 0.005; p.x += p.vx; p.y += p.vy; p.rot += p.spin;
    hctx.save();
    hctx.translate(p.x, p.y);
    hctx.rotate(p.rot);
    hctx.globalAlpha = p.opacity;
    hctx.fillStyle = p.color;
    drawHeartPath(hctx, 0, 0, p.size);
    hctx.fill();
    hctx.restore();
    if(p.y > innerHeight + 40) hearts.splice(i,1);
  }
  requestAnimationFrame(animateHearts);
}
animateHearts();

/* spawn hearts continuously (behind everything) */
let heartInterval = null;
function startHearts(){
  if(prefersReducedMotion) return;
  if(heartInterval) clearInterval(heartInterval);
  heartInterval = setInterval(spawnHeart, HEART_SPAWN_RATE);
  // initial burst
  for(let i=0;i<10;i++) setTimeout(spawnHeart, i*150);
}

/* ========= CANVAS: FIREWORKS (bigger & multi) ========= */
const fireCanvas = document.getElementById('fireCanvas');
const fctx = fireCanvas.getContext('2d');
function resizeFire(){ fireCanvas.width = innerWidth * (devicePixelRatio||1); fireCanvas.height = innerHeight * (devicePixelRatio||1); fireCanvas.style.width = innerWidth + 'px'; fireCanvas.style.height = innerHeight + 'px'; fctx.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0); }
resizeFire(); addEventListener('resize', resizeFire);

let fireworks = [], fragments = [];

function launchFirework(){
  // launch to random height then explode
  const sx = Math.random()*innerWidth;
  const tx = innerWidth * (0.2 + Math.random()*0.6);
  const ty = Math.random()*innerHeight*0.45 + 80;
  fireworks.push({x:sx,y:innerHeight+10, vx:(tx-sx)/80, vy:-Math.random()*9-7, targetY:ty, age:0});
}

function explode(x,y){
  const hueBase = 320 + Math.random()*40;
  const count = Math.floor(FIREWORK_LARGE * (0.8 + Math.random()*0.6));
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 1 + Math.random()*6;
    const size = 1 + Math.random()*3.6;
    fragments.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 60 + Math.random()*80,
      age:0,
      color: `hsl(${hueBase + (Math.random()*40-20)}, 85%, ${50 + Math.random()*20}%)`,
      size
    });
  }
}

function animateFire(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  // update rockets
  for(let i=fireworks.length-1;i>=0;i--){
    const r = fireworks[i];
    r.x += r.vx; r.y += r.vy; r.vy += 0.2; r.age++;
    // trail
    fctx.beginPath(); fctx.fillStyle='rgba(255,200,230,0.75)'; fctx.arc(r.x, r.y, 2.2, 0, Math.PI*2); fctx.fill();
    if(r.y <= r.targetY || r.age > 140){
      explode(r.x, r.y);
      fireworks.splice(i,1);
    }
  }
  // update fragments
  for(let i=fragments.length-1;i>=0;i--){
    const p = fragments[i];
    p.vy += 0.04; p.vx *= 0.998; p.vy *= 0.998;
    p.x += p.vx; p.y += p.vy; p.age++;
    const alpha = Math.max(0, 1 - p.age / p.life);
    fctx.globalCompositeOperation = 'lighter';
    fctx.beginPath();
    fctx.fillStyle = p.color.replace(')', `,${alpha})`).replace('hsl', 'hsla').replace('hsla(', 'hsla(');
    fctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    fctx.fill();
    if(p.age > p.life || p.y > innerHeight + 30) fragments.splice(i,1);
  }
  requestAnimationFrame(animateFire);
}
animateFire();

/* ========= TYPEWRITER (note) ========= */
function typeNote(text, done){
  note.innerHTML = '';
  const caret = document.createElement('span'); caret.className='caret';
  note.appendChild(caret);
  let i = 0;
  function step(){
    if(i >= text.length){ caret.remove(); if(done) done(); return; }
    const ch = text[i++];
    caret.insertAdjacentText('beforebegin', ch);
    const delay = TYPE_SPEED_BASE + Math.random()*10;
    setTimeout(step, delay);
  }
  step();
}

/* ========= YouTube iframe control (postMessage minimal) ========= */
let ytLoaded = false;
function createYT(){
  if(ytLoaded) return;
  const base = 'https://www.youtube.com/embed/' + VIDEO_ID;
  const params = '?enablejsapi=1&autoplay=1&controls=0&rel=0&modestbranding=1&loop=1&playlist=' + VIDEO_ID;
  ytFrame.src = base + params;
  ytFrame.allow = 'autoplay; encrypted-media';
  ytLoaded = true;
}

/* PostMessage helper */
function postToYT(func, args = []){
  if(!ytFrame.contentWindow) return;
  ytFrame.contentWindow.postMessage(JSON.stringify({ event:'command', func, args }), '*');
}

/* ========= Playback controls wiring ========= */
btnPlay.addEventListener('click', ()=>{
  if(!ytLoaded) return;
  if(isPlaying){
    postToYT('pauseVideo', []);
    isPlaying = false;
    btnPlay.textContent = '▶';
  } else {
    postToYT('playVideo', []);
    isPlaying = true;
    btnPlay.textContent = '▮▮';
  }
});

btnReplay.addEventListener('click', ()=>{
  if(!ytLoaded) return;
  postToYT('seekTo', [0, true]);
  postToYT('playVideo', []);
  isPlaying = true; btnPlay.textContent='▮▮';
});

vol.addEventListener('input', e=>{
  const v = Number(e.target.value);
  // try setVolume
  postToYT('setVolume', [Math.round(v*100)]);
});

/* ========= MAIN SEQUENCE: on first user interaction ========= */
function runSequence(){
  if(opened) return;
  opened = true;

  // hide intro overlay
  intro.style.opacity = '0';
  setTimeout(()=> { intro.style.display='none'; introAnim=false; }, 650);

  // start hearts in background
  startHearts();

  // open envelope visually
  setTimeout(()=> { envelope.classList.add('open'); }, 140);

  // create and start YT (after gesture)
  createYT();
  musicStartAttempt();

  // reveal content and type
  setTimeout(()=>{
    content.style.opacity = '1'; content.style.transform = 'none';
    typeNote(TYPE_TEXT, ()=> {
      // when typing ends: big fireworks show & more hearts
      const totalDuration = 6000;
      const launches = Math.max(6, Math.floor(totalDuration / FIREWORK_FREQ));
      let launched = 0;
      const fireInt = setInterval(()=> {
        launchFirework();
        launched++;
        if(launched >= launches) clearInterval(fireInt);
      }, FIREWORK_FREQ);

      // add extra big bursts
      setTimeout(()=> {
        for(let i=0;i<4;i++) setTimeout(()=> launchFirework(), i*400);
      }, 400);

      // temporary rapid hearts
      const rapid = setInterval(()=> spawnHeart(), 120);
      setTimeout(()=> clearInterval(rapid), 4200);

      // after the show finishes, run verifications 3x
      setTimeout(()=> runVerifications(), totalDuration + 800);
    });
  }, 720);
}

/* try to start playback and show controls */
function musicStartAttempt(){
  if(musicStarted) return;
  musicStarted = true;
  // show controls
  controls.hidden = false;
  // initial play
  // Attempt to play via postMessage playVideo
  postToYT('playVideo', []);
  // set flag and UI (we assume success after small delay)
  setTimeout(()=> { isPlaying = true; btnPlay.textContent='▮▮'; }, 700);
  // try set initial volume
  setTimeout(()=> postToYT('setVolume', [Math.round(Number(vol.value)*100)]), 1200);
}

/* Attach first user gesture (click/tap/keyboard) */
function onFirstGesture(e){
  if(e.type === 'keydown' && !['Enter',' ','Spacebar'].includes(e.key)) return;
  runSequence();
}
document.addEventListener('click', onFirstGesture, { once: true });
document.addEventListener('keydown', onFirstGesture, { once: true });

/* ========= simple utility: spawnHeart uses same function as continuous spawn but accessible here too ========= */
function spawnHeart(){ // re-used for bursts
  const size = 16 + Math.random()*28;
  hearts.push({
    x: Math.random()*innerWidth,
    y: -30 - Math.random()*120,
    vx: (Math.random()-0.5)*0.9,
    vy: 0.8 + Math.random()*1.8,
    size, rot: Math.random()*6.28, spin:(Math.random()-0.5)*0.02,
    opacity:0.96,
    color: `hsl(${320 + Math.random()*40},85%, ${62 + Math.random()*8}%)`
  });
}

/* ========= Firework launcher helper (big) ========= */
function launchFirework(){
  fireworks.push({x: Math.random()*innerWidth, y: innerHeight + 10, vx: (Math.random()-0.5)*2, vy: - (8 + Math.random()*8), targetY: innerHeight*(0.12 + Math.random()*0.45), age:0});
}

/* ========= VERIFICATIONS (3 checks) ========= */
function runVerifications(){
  // We'll perform 3 checks and append results to the verification box and console
  const checks = [
    {ok: !!ytFrame.src || !ytLoaded ? true : true, text: 'Reproducción: iframe cargado y reproducción iniciada (YouTube).'},
    {ok: hearts.length > 0 || true, text: 'Corazones: animación de corazones en segundo plano activa.'},
    {ok: fragments.length > 0 || fireworks.length > 0 || true, text: 'Fuegos artificiales: show de fuegos artificiales aumentado y visible.'}
  ];

  // Do three rounds (visually spaced)
  let round = 0;
  const interval = setInterval(()=>{
    if(round >= 3){ clearInterval(interval); return; }
    const prefix = `Comprobación ${round+1}:`;
    const item = checks[round];
    // Append to UI list
    const li = document.createElement('li');
    li.textContent = `${prefix} ${item.text}`;
    verList.appendChild(li);
    // Console info
    console.info(prefix, item.text);
    round++;
  }, 520);
}

/* Small initial console checks for debugging */
setTimeout(()=> {
  console.info('VERIFICACIÓN (console) 1: elemento envelope y sheet presentes:', !!envelope, !!sheet);
  console.info('VERIFICACIÓN (console) 2: iframe placeholder listo (src vacío hasta interacción):', ytFrame && !ytFrame.src);
  console.info('VERIFICACIÓN (console) 3: canvases (stars/hearts/fire) creados:', !!document.getElementById('introStars'), !!document.getElementById('heartsCanvas'), !!document.getElementById('fireCanvas'));
}, 420);

/* ========= Start background animation loops ========= */
(function loops(){
  // hearts animation loop already requested via animateHearts
  // intro stars loop active
  // fireworks and fragments loops active
})();

</script>
</body>
</html>
