<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Carta — Despliegue + YouTube</title>
<style>
  :root{
    --bg-a:#fff9fb; --bg-b:#fff0f6; --accent:#ff7aa8; --muted:#6a4350;
    --shadow:0 10px 36px rgba(106,67,80,0.08); --ease:cubic-bezier(.2,.9,.25,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;
    background: linear-gradient(180deg,var(--bg-a),var(--bg-b));
    color:var(--muted); -webkit-font-smoothing:antialiased; display:flex;
    align-items:center; justify-content:center; padding:28px; overflow:hidden;
  }

  .stage{ width:100%; max-width:980px; max-height:880px; height:100%;
    position:relative; display:flex; align-items:center; justify-content:center;
    border-radius:14px; overflow:visible; animation:fadeIn .6s both; }
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  canvas.bg, canvas.fw{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .hint{ position:absolute; top:14%; width:100%; text-align:center; font-weight:600; color:rgba(106,67,80,0.78); z-index:30; }

  /* Envelope / paper styles (unfolding) */
  .wrap{ width:360px; max-width:70vw; aspect-ratio:4/3; perspective:1100px; z-index:40; display:flex; align-items:center; justify-content:center; }
  .envelope{ width:100%; height:72%; border-radius:12px; background:linear-gradient(180deg,#fff,#fff7fb);
    box-shadow:var(--shadow); position:relative; transform-style:preserve-3d; transition:transform .36s var(--ease); display:flex; align-items:flex-end; justify-content:center; cursor:pointer; }
  .envelope:hover{ transform:translateY(-6px) scale(1.01); }

  .flap{ position:absolute; left:0; right:0; top:0; height:62%; border-top-left-radius:12px; border-top-right-radius:12px;
    background: linear-gradient(180deg,#ffedf6,#fff4fb); transform-origin:top center; transition: transform 780ms var(--ease); display:flex; align-items:flex-start; justify-content:center; padding-top:8%; z-index:6; }
  .seal{ width:64px; height:64px; border-radius:999px; display:grid; place-items:center; color:var(--accent); font-family:Georgia,serif; font-weight:700; transform:translateY(-6px); box-shadow:0 8px 20px rgba(255,140,170,0.08); background:linear-gradient(180deg,#fff,#ffeef8); }

  .body{ position:absolute; left:8%; right:8%; bottom:8%; top:40%; border-radius:8px;
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,248,250,0.98)); z-index:1; box-shadow: inset 0 6px 12px rgba(0,0,0,0.02); display:flex; align-items:flex-start; justify-content:center; padding-top:2%; }

  /* Sheet (starts folded inside envelope). More pronounced unfolding animation. */
  .sheet{
    width:86%; height:116%; position:relative; background: linear-gradient(180deg,#fff,#fff8fb);
    border-radius:8px; box-shadow: 0 12px 36px rgba(106,67,80,0.08);
    transform-origin: top center;
    /* start folded: pushed down + rotated (folded inside) */
    transform: translateY(32%) rotateX(82deg) scaleY(.86);
    opacity:0;
    transition: transform 820ms var(--ease), opacity 420ms;
    overflow:hidden; padding:18px; font-family:Georgia,serif; color:#5a3b43; font-size:15px; line-height:1.6;
    background-image: linear-gradient(transparent 0 2px, rgba(0,0,0,0.009) 2px), radial-gradient(rgba(0,0,0,0.004) 0.5px, transparent 0.5px);
    background-size:100% 28px, 6px 6px;
  }

  /* fold: the top part of paper that unfolds first (3D) */
  .fold{
    position:absolute; left:0; right:0; top:0; height:42%; background: linear-gradient(180deg,#fff9fb,#fff5f9);
    transform-origin: top center; transform: rotateX(88deg); transition: transform 820ms var(--ease); border-bottom-left-radius:12px; border-bottom-right-radius:12px; z-index:8;
    box-shadow: inset 0 -6px 12px rgba(0,0,0,0.02);
  }

  .content{ position:relative; margin-top:44%; opacity:0; transform: translateY(6px); transition: opacity 520ms var(--ease), transform 520ms var(--ease); padding-right:6px; }

  /* OPEN states */
  .envelope.open .flap{ transform: rotateX(172deg) translateY(-2%); box-shadow: 0 26px 60px rgba(106,67,80,0.12); }
  .envelope.open .sheet{ transform: translateY(-68%) rotateX(0deg) scaleY(1); opacity:1; }
  .envelope.open .sheet .fold{ transform: rotateX(0deg); }
  .envelope.open .content{ opacity:1; transform:none; transition-delay:420ms; }

  /* typewriter caret (no typing sound) */
  .caret{ display:inline-block; width:2px; height:1.06em; background: linear-gradient(180deg,var(--accent),#ffb3cf); margin-left:6px; animation:blink 900ms steps(1) infinite; vertical-align:bottom }
  @keyframes blink{50%{opacity:0}}

  .hearts{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:50; overflow:visible; }
  .heart{ position:absolute; width:20px; height:20px; transform-origin:center; opacity:0; animation:heartFloat 2200ms ease forwards; }
  @keyframes heartFloat{ 0%{ transform:translateY(0) scale(.85); opacity:1 } 100%{ transform:translateY(-220px) scale(1.05); opacity:0 } }

  .controls{ position:absolute; right:16px; bottom:16px; z-index:60; background: linear-gradient(180deg,#fff,#fff6fb); padding:8px 12px; border-radius:999px; box-shadow:var(--shadow); border:1px solid rgba(255,255,255,0.6); display:flex; gap:10px; align-items:center; display:none; }
  .controls input[type="range"]{ width:120px; accent-color:var(--accent) }
  .controls button{ background:transparent; border:none; font-size:16px; color:var(--accent); cursor:pointer }

  .flash{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:70; opacity:0; background: radial-gradient(circle at 50% 10%, rgba(255,230,240,0.24), transparent 30%); transition:opacity .6s ease; }
  .flash.on{ opacity:1; }

  .label{ position:absolute; left:18px; bottom:14px; font-size:12px; color:rgba(106,67,80,0.46); z-index:45 }

  @media (max-width:640px){
    .wrap{ width:86vw; aspect-ratio:1; }
    .sheet{ padding:14px; font-size:14px; }
    .controls input[type="range"]{ width:88px; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="bgCanvas" class="bg"></canvas>
    <canvas id="fwCanvas" class="fw"></canvas>

    <div class="hint" id="hint">Haz clic en cualquier lugar</div>

    <div class="wrap">
      <div class="envelope" id="envelope" role="button" aria-label="Carta">
        <div class="flap" id="flap"><div class="seal">♡</div></div>
        <div class="body">
          <div class="sheet" id="sheet" aria-live="polite">
            <div class="fold" id="fold"></div>
            <div class="content" id="content"><div id="note"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="hearts" id="hearts"></div>

    <div class="controls" id="controls">
      <button id="btnToggle" aria-label="Pausa/Reanuda">▮▮</button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.45" aria-label="Volumen">
    </div>

    <div class="flash" id="flash"></div>
    <div class="label">Buena suerte — Edición Especial (YouTube)</div>

    <!-- Hidden iframe player: se añadirá (src) tras la interacción del usuario.
         Nota: enablejsapi=1 permite control via postMessage sin cargar librerías externas -->
    <iframe id="ytPlayer" style="width:0;height:0;border:0;visibility:hidden;position:absolute;left:-9999px;" allow="autoplay"></iframe>
  </div>

<script>
/* ---------- Variables DOM ---------- */
const envelope = document.getElementById('envelope');
const sheet = document.getElementById('sheet');
const fold = document.getElementById('fold');
const content = document.getElementById('content');
const noteEl = document.getElementById('note');
const hint = document.getElementById('hint');
const heartsRoot = document.getElementById('hearts');
const controls = document.getElementById('controls');
const btnToggle = document.getElementById('btnToggle');
const volumeInput = document.getElementById('volume');
const flash = document.getElementById('flash');
const ytPlayer = document.getElementById('ytPlayer');

let opened = false;
let musicStarted = false;
let ytReady = false;
let isPlaying = false;
let videoId = 'MnGdAvOiAlI'; // video encontrado para "Buena Suerte - Edicion Especial". Fuente: web.run. :contentReference[oaicite:1]{index=1}

/* --------- Typewriter content (no typing sound) --------- */
const paragraphs = [
`Mi amor,

Desde que llegaste, lo cotidiano se volvió un refugio. Tu risa ilumina los días y tus detalles pequeñas certezas que me sostienen. Gracias por existir.`,

`Quiero cuidar cada gesto que construye lo nuestro: la paciencia, las risas compartidas y los silencios que hablan. Prometo ternura y constancia.`,

`Si alguna vez dudas, acércate: aquí hay manos dispuestas a sostener y ganas sinceras de acompañar. Caminemos juntos, paso a paso, con calma.`,

`Con todo mi cariño,
Siempre tuyo.

PD: guarda este papel como un abrazo pequeño en tu día.`
];

function typeWriter(lines, target, onDone){
  target.innerHTML = '';
  const caret = document.createElement('span'); caret.className = 'caret';
  let pIdx = 0, chIdx = 0;
  function write(){
    if(pIdx >= lines.length){ if(onDone) onDone(); return; }
    const txt = lines[pIdx];
    if(chIdx === 0){
      const p = document.createElement('p'); p.dataset.idx = pIdx; target.appendChild(p);
      if(pIdx === 0){
        const h = document.createElement('h1');
        h.textContent = 'Para ti';
        h.style.margin = '0 0 8px 0';
        h.style.color = '#7a3b4a';
        h.style.fontFamily = 'Georgia, serif';
        h.style.fontSize = '20px';
        target.insertBefore(h, p);
      }
      p.appendChild(caret);
    }
    const p = target.querySelector(`p[data-idx="${pIdx}"]`);
    const ch = txt.charAt(chIdx);
    caret.insertAdjacentText('beforebegin', ch);
    chIdx++;
    const delay = 10 + Math.random()*18;
    if(chIdx < txt.length) setTimeout(write, delay);
    else {
      chIdx = 0; pIdx++;
      setTimeout(()=> {
        const spacer = document.createElement('div'); spacer.style.height = '8px';
        target.appendChild(spacer);
        setTimeout(write, 520 + Math.random()*420);
      }, 180);
    }
  }
  setTimeout(write, 360);
}

/* ---------- small heart spawn ---------- */
function spawnHeart(x=null,y=null){
  const el = document.createElement('div'); el.className = 'heart';
  const size = 14 + Math.random()*18; el.style.width = el.style.height = size+'px';
  const startX = x!==null ? x : (window.innerWidth*0.48 + (Math.random()*160-80));
  const startY = y!==null ? y : (window.innerHeight*0.5 + (Math.random()*40-20));
  el.style.left = (startX)+'px'; el.style.top = (startY)+'px';
  el.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s-7.5-4.9-10-8.1C-0.1 8.2 4.5 3 8.6 5.1 10.5 6.1 12 7.7 12 7.7s1.5-1.6 3.4-2.6C19.5 3 24.1 8.2 22 12.9 19.5 16.1 12 21 12 21z" fill="#ff9fc3"/></svg>`;
  heartsRoot.appendChild(el);
  setTimeout(()=> el.remove(), 2500);
}

/* ---------- Fireworks (brief) ---------- */
(function initFW(){
  const c = document.getElementById('fwCanvas');
  const ctx = c.getContext('2d');
  let w,h;
  function resize(){ w=c.width=innerWidth*(devicePixelRatio||1); h=c.height=innerHeight*(devicePixelRatio||1); ctx.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0); }
  resize(); addEventListener('resize', resize);
  const parts = [];
  function spawn(x,y,color){
    for(let i=0;i<36;i++){
      const a=Math.random()*Math.PI*2, s=1.6+Math.random()*4.4;
      parts.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0, ttl:60+Math.round(Math.random()*60), size:1.2+Math.random()*3.2, color});
    }
  }
  function draw(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.vy*=0.99; p.vy+=0.04; p.life++;
      const alpha = Math.max(0,1 - p.life/p.ttl);
      ctx.beginPath(); ctx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${alpha})`; ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      if(p.life>=p.ttl || p.y>innerHeight+20) parts.splice(i,1);
    }
    requestAnimationFrame(draw);
  }
  window._startFW = function(duration=4200){
    const colors=[ {r:255,g:150,b:190}, {r:255,g:255,b:255}, {r:245,g:200,b:120} ];
    const start=Date.now();
    const timer=setInterval(()=>{ spawn(Math.random()*innerWidth, Math.random()*innerHeight*0.45, colors[Math.floor(Math.random()*colors.length)]); if(Date.now()-start>duration) clearInterval(timer); }, 280);
    draw();
  };
})();

/* ---------- YouTube player control (enablejsapi=1 + postMessage commands) ---------- */
function createYouTubePlayerOnce(){
  if(ytReady) return;
  // build embed URL: enablejsapi=1 for JS control; autoplay=1 to start after gesture
  const base = 'https://www.youtube.com/embed/' + videoId;
  const params = '?enablejsapi=1&autoplay=1&controls=0&rel=0&modestbranding=1&loop=1&playlist=' + videoId + '&iv_load_policy=3';
  ytPlayer.src = base + params;
  ytPlayer.allow = 'autoplay; encrypted-media';
  ytReady = true;
}

/* send commands via postMessage to embedded iframe (YouTube API minimal) */
function postToYT(command, args=[]){
  if(!ytPlayer.contentWindow) return;
  ytPlayer.contentWindow.postMessage(JSON.stringify({ event: 'command', func: command, args: args }), '*');
}

/* toggle play/pause (we rely on YouTube commands: playVideo / pauseVideo) */
function togglePlayback(){
  if(!ytReady) return;
  if(isPlaying){
    postToYT('pauseVideo', []);
    isPlaying = false;
    btnToggle.textContent = '▶︎';
  } else {
    postToYT('playVideo', []);
    isPlaying = true;
    btnToggle.textContent = '▮▮';
  }
}

/* ensure volume control adjusts playback: YouTube iframe doesn't accept volume via postMessage reliably across origins,
   so we emulate by setting iframe volume via the Player API if available; fallback: inform user they can use system volume.
   We'll attempt: postToYT('setVolume', [value*100]) — some embeds accept it. */
function setYTVolume(v){
  if(!ytReady) return;
  try{ postToYT('setVolume', [Math.round(v*100)]); }catch(e){ /* ignore */ }
}

/* ---------- Click anywhere: open envelope + start YouTube (only once) ---------- */
function onFirstClick(){
  if(opened) return;
  opened = true;

  // 3 verificaciones en consola (para que puedas ver)
  console.info('VERIFICACIÓN 1: elemento envelope y sheet:', !!envelope, !!sheet);
  console.info('VERIFICACIÓN 2: elemento iframe listo (no src hasta interacción):', ytPlayer && !ytPlayer.src);
  console.info('VERIFICACIÓN 3: canvases presentes (bg/fw):', !!document.getElementById('bgCanvas'), !!document.getElementById('fwCanvas'));

  // hide hint
  hint.style.opacity = '0'; hint.style.transition = 'opacity .5s';

  // open envelope and unfold sheet (CSS handles animation)
  setTimeout(()=> {
    envelope.classList.add('open');
    for(let i=0;i<6;i++) setTimeout(()=> spawnHeart(), i*120);
  }, 120);

  // reveal content and start typing (no typing sound)
  setTimeout(()=> {
    content.style.opacity = '1'; content.style.transform = 'none';
    typeWriter(paragraphs, noteEl, ()=> {
      // onComplete: fireworks + hearts
      setTimeout(()=> {
        if(window._startFW) window._startFW(5200);
        const hi = setInterval(()=> spawnHeart(), 260);
        setTimeout(()=> clearInterval(hi), 3400);
      }, 520);
    });
  }, 720);

  // Start YouTube playback (create iframe src now). Only once.
  if(!musicStarted){
    musicStarted = true;
    createYouTubePlayerOnce();
    // small flash
    flash.classList.add('on'); setTimeout(()=> flash.classList.remove('on'), 700);

    // after a short delay allow controls to show
    setTimeout(()=> { controls.style.display = 'flex'; btnToggle.textContent = '▮▮'; isPlaying = true; }, 900);

    // Try to set initial volume (best-effort via Player API)
    setTimeout(()=> setYTVolume(Number(volumeInput.value || 0.45)), 1200);
  }
}

/* Attach once to document (click anywhere) */
document.addEventListener('click', onFirstClick, { once:true });

/* keyboard accessibility */
document.addEventListener('keydown', (e)=>{
  if((e.key === 'Enter' || e.key === ' ') && !opened) onFirstClick();
  else if((e.key === 'Enter' || e.key === ' ') && opened) togglePlayback();
});

/* controls events */
btnToggle.addEventListener('click', ()=> togglePlayback());
volumeInput.addEventListener('input', (e)=> setYTVolume(Number(e.target.value)));

window.addEventListener('resize', ()=> { /* canvases resize handled elsewhere */ });

/* final triple check (human-readable summary) — console logs */
setTimeout(()=> {
  console.info('REVISION FINAL 1: YouTube embed videoId =', videoId, ' (se cargará al primer clic).');
  console.info('REVISION FINAL 2: Sheet unfolding CSS present (.envelope.open .sheet).');
  console.info('REVISION FINAL 3: Typing sound removed (typeWriter DOES NOT call WebAudio).');
}, 420);
</script>
</body>
</html>
